services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: 'mysql'
    ports:
      - "3308:3306"
    volumes:
    - mysql_data:/var/lib/mysql

  php-app:
    build: .
    container_name: php_app
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

volumes:
  mysql_data: